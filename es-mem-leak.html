  html, .container {
    margin: auto;

    display: block;
    height: 100%;
  margin: 0;
  font-size: 20px;
  font-family: "Shantell Sans", serif;
  font-optical-sizing: auto;
  font-weight: 600;
  font-style: normal;
  font-variation-settings:
    "BNCE" -34,
    "INFM" 26,
    "SPAC" 7.9;

  .left .dialogue {

  .right .dialogue {

  .dialogue.brush {
    color: #FF3082;

  }

    color: #FF5A19;
    background-color: #FF5A19;
